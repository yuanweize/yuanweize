name: Metrics
on:
  # --- 保持频率 ---
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # --- 基础配置 ---
          user: yuanweize
          template: classic
          # ✅ 按照要求：保留了 community
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Prague

          # --- 插件：语言 (显示文件体积) ---
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell,
            gnuplot, roff, jupyter notebook
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_colors: "github"
          plugin_languages_threshold: 0%
          plugin_languages_details:  percentage

          # --- 插件：行数统计 (这里是显示 400万行 的关键) ---
          plugin_lines: yes
          # 加上这行确保统计所有历史，让数字变大
          plugin_lines_history_limit: 1 
          plugin_lines_repositories_limit: 20

          # --- 插件：3D 提交日历 ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- 插件：GitHub 成就 ---
          plugin_achievements: no
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          # 🛑 必须设为 no，否则会报 "Unexpected error" 导致整个 Action 失败
          plugin_achievements_secrets: no 
          plugin_achievements_limit: 0

          # --- 插件：Steam ---
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          # ✅ 你的正确 ID
          plugin_steam_user: "76561198444894836"
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_games_limit: 1
          plugin_steam_recent_games_limit: 1
