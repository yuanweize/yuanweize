name: Metrics
on:
  # --- 保持频率 ---
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # --- 基础配置 ---
          user: yuanweize
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Prague

          # --- 插件：语言 ---
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell,
            gnuplot, roff, jupyter notebook
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_colors: "github"
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage

          # --- 插件：行数统计 ---
          plugin_lines: yes

          # --- 插件：3D 提交日历 ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- 插件：GitHub 成就 (修复尝试) ---
          plugin_achievements: no
          plugin_achievements_display: compact
          # ⚠️ 如果还是报错，尝试把 threshold 改为 B 或 A，或者暂时设为 no
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0

          # --- 新增插件：Steam ---
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          # 🛑 下面这行必须改成你自己的 64位 Steam ID (数字)
          plugin_steam_user: "76561198444894836"
          # 显示：个人资料、玩得最多的游戏、最近玩的游戏
          plugin_steam_sections: player, most-played, recently-played
          # 显示玩得最多的游戏数量
          plugin_steam_games_limit: 1
          # 显示最近玩的游戏数量
          plugin_steam_recent_games_limit: 1
